<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" font-family="Segoe UI, Inter, Arial, sans-serif" role="img"><rect width="1200" height="330" rx="18" fill="#ffffff"/><text x="56" y="58" font-size="26" fill="#0b1b1e" font-weight="700" text-anchor="start">How it works</text><text x="56" y="84" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">Four steps. The separate browser window only opens after you press Start, and you confirm the login yourself.</text><rect x="56" y="120" width="248" height="160" rx="16" fill="#ffffff" stroke="#e3e9ea"/><circle cx="90" cy="152" r="16" fill="#bbf3f6"/><text x="90" y="158" font-size="16" fill="#016268" font-weight="700" text-anchor="middle">1</text><text x="76" y="198" font-size="15" fill="#0b1b1e" font-weight="600" text-anchor="start">Double-click START.bat</text><text x="76" y="224" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">Needs Node.js 20 or newer.</text><text x="76" y="243" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">The local page opens, plus a</text><text x="76" y="262" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">small console window.</text><path d="M308 190 h14 m-8 -5 l8 5 l-8 5" fill="none" stroke="#c3ced1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="336" y="120" width="248" height="160" rx="16" fill="#ffffff" stroke="#e3e9ea"/><circle cx="370" cy="152" r="16" fill="#bbf3f6"/><text x="370" y="158" font-size="16" fill="#016268" font-weight="700" text-anchor="middle">2</text><text x="356" y="198" font-size="15" fill="#0b1b1e" font-weight="600" text-anchor="start">Pick rooms, press Start</text><text x="356" y="224" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">A popup walks the steps first;</text><text x="356" y="243" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">a separate browser window</text><text x="356" y="262" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">opens on a fresh Weverse page.</text><path d="M588 190 h14 m-8 -5 l8 5 l-8 5" fill="none" stroke="#c3ced1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="616" y="120" width="248" height="160" rx="16" fill="#ffffff" stroke="#e3e9ea"/><circle cx="650" cy="152" r="16" fill="#bbf3f6"/><text x="650" y="158" font-size="16" fill="#016268" font-weight="700" text-anchor="middle">3</text><text x="636" y="198" font-size="15" fill="#0b1b1e" font-weight="600" text-anchor="start">Log in, then continue</text><text x="636" y="224" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">Log in there and keep the</text><text x="636" y="243" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">Home page open, then press</text><text x="636" y="262" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">"I'm logged in - continue".</text><path d="M868 190 h14 m-8 -5 l8 5 l-8 5" fill="none" stroke="#c3ced1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="896" y="120" width="248" height="160" rx="16" fill="#ffffff" stroke="#e3e9ea"/><circle cx="930" cy="152" r="16" fill="#bbf3f6"/><text x="930" y="158" font-size="16" fill="#016268" font-weight="700" text-anchor="middle">4</text><text x="916" y="198" font-size="15" fill="#0b1b1e" font-weight="600" text-anchor="start">Open DM when it's done</text><text x="916" y="224" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">History walks backwards, the</text><text x="916" y="243" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">page is built, media saved;</text><text x="916" y="262" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">press Open DM to read it.</text></svg>