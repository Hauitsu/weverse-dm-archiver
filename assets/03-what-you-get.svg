<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" width="1040" height="400" font-family="Segoe UI, Inter, Arial, sans-serif" role="img"><rect width="1040" height="400" rx="18" fill="#ffffff"/><text x="56" y="58" font-size="26" fill="#0b1b1e" font-weight="900" text-anchor="start">What you get</text><text x="56" y="84" font-size="14" fill="#5b6b70" font-weight="600" text-anchor="start">Everything lands next to the tool, on your own disk.</text><rect x="56" y="112" width="560" height="236" rx="16" fill="#fbfdfd" stroke="#e3e9ea"/><text x="84" y="158" font-size="15" fill="#0b1b1e" font-weight="700" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace">weverse-dm-archiver/</text><text x="84" y="190" font-size="15" fill="#0b1b1e" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace">  rooms/</text><text x="217.5" y="190" font-size="13" fill="#016268" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace">&lt;room&gt;.html</text><text x="84" y="222" font-size="15" fill="#0b1b1e" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace">  rooms-public/</text><text x="217.5" y="222" font-size="13" fill="#016268" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace">&lt;room&gt;.html</text><text x="84" y="254" font-size="15" fill="#0b1b1e" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace">  media/</text><text x="217.5" y="254" font-size="13" fill="#5b6b70" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace">photos, videos, audio</text><text x="84" y="286" font-size="15" fill="#0b1b1e" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace">  config.json</text><text x="217.5" y="286" font-size="13" fill="#5b6b70" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace">your settings</text><text x="84" y="318" font-size="15" fill="#0b1b1e" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace">  START.bat</text><text x="217.5" y="318" font-size="13" fill="#5b6b70" font-weight="600" text-anchor="start" font-family="Cascadia Mono, Consolas, monospace">the only file you click</text><rect x="648" y="128" width="336" height="62" rx="14" fill="#bbf3f6"/><text x="668" y="154" font-size="14" fill="#016268" font-weight="900" text-anchor="start">private export</text><text x="668" y="176" font-size="13" fill="#5b6b70" font-weight="600" text-anchor="start">Every message, both sides, plus your bookmarks.</text><rect x="648" y="204" width="336" height="62" rx="14" fill="#ffe9f0"/><text x="668" y="230" font-size="14" fill="#b3245c" font-weight="900" text-anchor="start">public export</text><text x="668" y="252" font-size="13" fill="#5b6b70" font-weight="600" text-anchor="start">Artist side only, your nickname replaced with EverAfter.</text><rect x="648" y="280" width="336" height="62" rx="14" fill="#f2f3f7"/><text x="668" y="306" font-size="14" fill="#5b6b70" font-weight="900" text-anchor="start">media</text><text x="668" y="328" font-size="13" fill="#5b6b70" font-weight="600" text-anchor="start">Original files, downloaded as they are.</text></svg>