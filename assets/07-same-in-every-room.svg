<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 400" width="1040" height="400" font-family="Segoe UI, Inter, Arial, sans-serif" role="img"><rect width="1040" height="400" rx="18" fill="#ffffff"/><text x="56" y="58" font-size="26" fill="#0b1b1e" font-weight="700" text-anchor="start">DM Viewer Features</text><text x="56" y="84" font-size="14" fill="#5b6b70" font-weight="400" text-anchor="start">One page build for every room and both exports; only the export options differ. These tools are always there.</text><rect x="56" y="118" width="296" height="118" rx="14" fill="#fbfdfd" stroke="#e3e9ea"/><text x="76" y="154" font-size="15" fill="#0b1b1e" font-weight="600" text-anchor="start">Jump to date</text><text x="76" y="182" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">A side panel lists every month and</text><text x="76" y="202" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">day. One click lands you there.</text><rect x="372" y="118" width="296" height="118" rx="14" fill="#fbfdfd" stroke="#e3e9ea"/><text x="392" y="154" font-size="15" fill="#0b1b1e" font-weight="600" text-anchor="start">Translation</text><text x="392" y="182" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">Original, English, or both at once,</text><text x="392" y="202" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">when the archive carries them.</text><rect x="688" y="118" width="296" height="118" rx="14" fill="#fbfdfd" stroke="#e3e9ea"/><text x="708" y="154" font-size="15" fill="#0b1b1e" font-weight="600" text-anchor="start">Days together</text><text x="708" y="182" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">A live counter in the header, from</text><text x="708" y="202" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">the first message. Rename the words.</text><rect x="56" y="252" width="296" height="118" rx="14" fill="#fbfdfd" stroke="#e3e9ea"/><text x="76" y="288" font-size="15" fill="#0b1b1e" font-weight="600" text-anchor="start">Message options</text><text x="76" y="316" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">Three dots: copy the text or its</text><text x="76" y="336" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">date and time, or bookmark it.</text><rect x="372" y="252" width="296" height="118" rx="14" fill="#fbfdfd" stroke="#e3e9ea"/><text x="392" y="288" font-size="15" fill="#0b1b1e" font-weight="600" text-anchor="start">Gifts and media</text><text x="392" y="316" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">Media viewer, original quality,</text><text x="392" y="336" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">gifts keep their art.</text><rect x="688" y="252" width="296" height="118" rx="14" fill="#fbfdfd" stroke="#e3e9ea"/><text x="708" y="288" font-size="15" fill="#0b1b1e" font-weight="600" text-anchor="start">Themes (Light/Dark)</text><circle cx="716" cy="320" r="8" fill="#07CBC9"/><circle cx="740" cy="320" r="8" fill="#01DC3A"/><circle cx="764" cy="320" r="8" fill="#2EB3FE"/><circle cx="788" cy="320" r="8" fill="#7540FE"/><circle cx="812" cy="320" r="8" fill="#F75AFF"/><circle cx="836" cy="320" r="8" fill="#FFB600"/><circle cx="860" cy="320" r="8" fill="#FF6E01"/><circle cx="884" cy="320" r="8" fill="#FF3C7E"/><circle cx="908" cy="320" r="8" fill="#FE2222"/><circle cx="932" cy="320" r="8" fill="#53565D"/><text x="708" y="352" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">One pick covers light and dark.</text></svg>