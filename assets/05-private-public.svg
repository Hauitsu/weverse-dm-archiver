<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 372" width="1040" height="372" font-family="Segoe UI, Inter, Arial, sans-serif" role="img"><rect width="1040" height="372" rx="18" fill="#ffffff"/><text x="56" y="56" font-size="26" fill="#0b1b1e" font-weight="700" text-anchor="start">Two exports, one harvest</text><text x="56" y="82" font-size="13" fill="#5b6b70" font-weight="400" text-anchor="start">Every run writes both: rooms/&lt;room&gt;.html for you, rooms-public/&lt;room&gt;.html to hand out.</text><rect x="56" y="100" width="440" height="236" rx="16" fill="#f4fbfc" stroke="#cfe9ec"/><text x="84" y="138" font-size="17" fill="#016268" font-weight="700" text-anchor="start">Private — rooms/&lt;room&gt;.html</text><path d="M80 173 l4 4 l8 -9" fill="none" stroke="#016268" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="112" y="172" font-size="14" fill="#1f4f57" font-weight="400" text-anchor="start">Every message, both sides of the room</text><path d="M80 205 l4 4 l8 -9" fill="none" stroke="#016268" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="112" y="204" font-size="14" fill="#1f4f57" font-weight="400" text-anchor="start">Your profile &amp; nickname stay</text><path d="M80 237 l4 4 l8 -9" fill="none" stroke="#016268" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="112" y="236" font-size="14" fill="#1f4f57" font-weight="400" text-anchor="start">Photos and video linked from media/</text><path d="M80 269 l4 4 l8 -9" fill="none" stroke="#016268" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="112" y="268" font-size="14" fill="#1f4f57" font-weight="400" text-anchor="start">Manually add bookmarks</text><path d="M80 301 l4 4 l8 -9" fill="none" stroke="#016268" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="112" y="300" font-size="14" fill="#1f4f57" font-weight="400" text-anchor="start">Stays on your disk, never uploaded</text><rect x="544" y="100" width="440" height="236" rx="16" fill="#fff5f8" stroke="#f6d5e0"/><text x="572" y="138" font-size="17" fill="#b3245c" font-weight="700" text-anchor="start">Public — rooms-public/&lt;room&gt;.html</text><path d="M572 173 l4 4 l8 -9" fill="none" stroke="#b3245c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="604" y="172" font-size="14" fill="#7d2a44" font-weight="400" text-anchor="start">Artist messages only, yours dropped</text><path d="M572 205 l4 4 l8 -9" fill="none" stroke="#b3245c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="604" y="204" font-size="14" fill="#7d2a44" font-weight="400" text-anchor="start">Your nickname becomes EverAfter</text><path d="M572 237 l4 4 l8 -9" fill="none" stroke="#b3245c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="604" y="236" font-size="14" fill="#7d2a44" font-weight="400" text-anchor="start">No bookmarks, nothing personal</text><path d="M572 269 l4 4 l8 -9" fill="none" stroke="#b3245c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="604" y="268" font-size="14" fill="#7d2a44" font-weight="400" text-anchor="start">Safe to hand out — the share zip packs it</text><path d="M572 301 l4 4 l8 -9" fill="none" stroke="#b3245c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="604" y="300" font-size="14" fill="#7d2a44" font-weight="400" text-anchor="start">Low quality version available</text></svg>